<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Fast Is the Space Station?</title>
<meta name="description" content="Race the International Space Station against a car, a plane and a cheetah, watch it circle the Earth, and find out why it has to fly so fast.">
<style>

</style>
</head>
<body>

        <rect x="34" y="-30" width="12" height="26"/><rect x="34" y="4" width="12" height="26"/>
      </g>

      <rect x="-49" y="-3" width="98" height="6" rx="1.5" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>
      <rect x="-15" y="-6" width="30" height="12" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>

    </symbol>
  </defs>

  <!-- ================= HEADER ================= -->
  <a href="../" aria-label="Back to all machines">
    <g class="btn">
      <rect x="30" y="15" width="158" height="38" rx="19" fill="#fff" stroke="#94a3b8" stroke-width="2.5"/>
      <text x="109" y="40" text-anchor="middle" font-size="17" font-weight="bold" fill="#334155">← All machines</text>
    </g>
  </a>
  <text x="800" y="46" text-anchor="middle" font-size="34" font-weight="bold" fill="#1e293b">How FAST is the Space Station? 🚀</text>

  <!-- ================= STOPWATCH PANEL ================= -->
  <rect x="30" y="495" width="1000" height="305" rx="22" fill="url(#swGrad)" stroke="#c4b5fd" stroke-width="3"/>
  <text x="50" y="533" font-size="24" font-weight="bold" fill="#4c1d95">⏱️ How far does it go in…?</text>
  <text id="swDist" x="50" y="600" font-size="60" font-weight="bold" fill="#6d28d9">0 m</text>
  <text id="swTime" x="54" y="634" font-size="21" font-weight="bold" fill="#334155">in 0 seconds</text>
  <text id="swCmp" x="54" y="664" font-size="16" font-weight="bold" fill="#64748b">Press a button to start the clock</text>

    <!-- ---------- ORBIT VIEW ---------- -->
    <g id="orbitG">

      <text x="1066" y="150" font-size="15" font-weight="bold" fill="#fde68a">☀️ Sunlight →</text>
      <circle cx="1310" cy="320" r="124" fill="none" stroke="#7dd3fc" stroke-width="5" opacity="0.35"/>

    <g id="throwG" display="none">

      <circle cx="1310" cy="320" r="115" fill="url(#oceanGrad)"/>
      <g fill="#22c55e" opacity="0.9">
        <ellipse cx="1262" cy="292" rx="36" ry="20" transform="rotate(-30 1262 292)"/>
        <ellipse cx="1350" cy="268" rx="42" ry="18" transform="rotate(20 1350 268)"/>
        <ellipse cx="1372" cy="350" rx="26" ry="32"/>
        <ellipse cx="1290" cy="388" rx="28" ry="18" transform="rotate(-15 1290 388)"/>
      </g>
      <rect x="1306" y="155" width="8" height="52" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
      <rect x="1296" y="150" width="28" height="7" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
      <text x="1310" y="146" text-anchor="middle" font-size="18">🧒</text>
      <text x="1322" y="226" font-size="13" font-weight="bold" fill="#e2e8f0">pretend tower,</text>
      <text x="1322" y="241" font-size="13" font-weight="bold" fill="#e2e8f0">400 km tall!</text>
      <g id="ghosts"></g>
      <polyline id="ballPath" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text id="boom" font-size="26" text-anchor="middle" display="none">💥</text>
      <circle id="ball" cx="1310" cy="155" r="7" fill="#f97316" stroke="#fff7ed" stroke-width="2"/>
      <text x="1310" y="562" text-anchor="middle" font-size="13" fill="#94a3b8">Real gravity and real speeds. Heights are stretched so you can see them.</text>
    </g>

  <g id="tabs"></g>

  <!-- ================= BOTTOM EXPLANATION BANNER ================= -->
  <foreignObject x="30" y="812" width="1540" height="80">
    <div class="msg" id="msg"><span class="emo" id="msgEmo"></span><span id="msgText"></span></div>
  </foreignObject>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(attrs, text, parent) {
  const t = el('text', { 'font-size': 15, 'font-weight': 'bold', fill: '#334155', ...attrs }, parent);
  t.textContent = text;
  return t;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtInt = n => Math.round(n).toLocaleString('en-US');

function say(emo, html) { $('msgEmo').textContent = emo; $('msgText').innerHTML = html; }

// A rounded button made of a rect and a label. Works with mouse, touch and keyboard.
function makeBtn(parent, o, onClick) {
  const fs = o.fs || 16;
  const g = el('g', { class: 'btn', role: 'button', tabindex: 0, transform: `translate(${o.x} ${o.y})` }, parent);
  const r = el('rect', { width: o.w, height: o.h, rx: o.rx ?? o.h / 2, fill: o.fill || '#fff', stroke: o.stroke || '#94a3b8', 'stroke-width': 2.5 }, g);
  const t = txt({ x: o.w / 2, y: o.h / 2 + fs * 0.36, 'text-anchor': 'middle', 'font-size': fs, fill: o.color || '#334155' }, o.label, g);
  g.addEventListener('click', onClick);
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } });
  g.setLabel = s => { t.textContent = s; };
  g.setLook = (fill, stroke, color) => { r.setAttribute('fill', fill); r.setAttribute('stroke', stroke); t.setAttribute('fill', color); };
  return g;
}

// "49 sec", "2 min 37 sec", "3 hr 8 min", "10 days"
function fmtDur(s) {
  if (s < 60) return `${Math.max(1, Math.round(s))} sec`;
  if (s < 3600) { const n = Math.round(s), m = Math.floor(n / 60), r = n % 60; return r ? `${m} min ${r} sec` : `${m} min`; }
  if (s < 86400) { const n = Math.round(s / 60), h = Math.floor(n / 60), m = n % 60; return m ? `${h} hr ${m} min` : `${h} hr`; }
  const n = Math.round(s / 3600), d = Math.floor(n / 24), h = n % 24;
  return `${d} day${d === 1 ? '' : 's'}` + (h ? ` ${h} hr` : '');
}

// =========================================================================
// REAL NUMBERS
// =========================================================================
const ISS_KMS = 7.66;            // km every second
const ISS_KMH = 27600;           // km every hour
const ORBIT_S = 92.4 * 60;       // one lap around the Earth, in seconds
const DAY_S = 86164;             // one turn of the Earth (sidereal day)

// =========================================================================
// 1. THE GREAT RACE
// =========================================================================
const RACERS = [
  { id: 'iss',     emo: null, name: 'Space Station',   kmh: ISS_KMH, color: '#7c3aed' },
  { id: 'jet',     emo: '🛩️', name: 'Fighter jet',     kmh: 2200,    color: '#475569' },
  { id: 'plane',   emo: '✈️', name: 'Airplane',        kmh: 900,     color: '#2563eb' },
  { id: 'train',   emo: '🚄', name: 'Bullet train',    kmh: 300,     color: '#0891b2' },
  { id: 'car',     emo: '🚗', name: 'Car on motorway', kmh: 120,     color: '#dc2626' },
  { id: 'cheetah', emo: '🐆', name: 'Cheetah',         kmh: 110,     color: '#d97706' },
  { id: 'bike',    emo: '🚲', name: 'Bicycle',         kmh: 20,      color: '#0d9488' },
  { id: 'walk',    emo: '🚶', name: 'Walking',         kmh: 5,       color: '#64748b' },
];
const ROUTES = [
  { id: 'isb',   label: 'Lahore → Islamabad', from: 'Lahore', to: 'Islamabad', km: 375 },
  { id: 'khi',   label: 'Lahore → Karachi',   from: 'Lahore', to: 'Karachi',   km: 1200 },
  { id: 'lon',   label: 'Lahore → London',    from: 'Lahore', to: 'London',    km: 6300 },
  { id: 'earth', label: 'Around the Earth',   from: 'Start',  to: 'All the way round', km: 40075 },
];
const TRACK_X0 = 250, TRACK_X1 = 880, LANE_Y0 = 134, LANE_H = 35;
const ISS_SHOW_S = 4;            // the ISS always takes about 4 real seconds on screen

const RS = { route: ROUTES[0], phase: 'idle', t: 0, base: 1, rate: 0, pause: 0, ff: 0, done: new Set() };
const lanes = {};
const tripTime = r => RS.route.km / r.kmh * 3600;   // seconds

const routeBtns = ROUTES.map((r, i) => makeBtn($('routeBtns'),
  { x: 314 + i * 175, y: 82, w: 169, h: 34, label: r.label, fs: 14 }, () => pickRoute(r)));

const routeFrom = txt({ x: TRACK_X0, y: 129, 'font-size': 13, fill: '#0369a1' }, '', $('lanes'));
const routeTo = txt({ x: TRACK_X1, y: 129, 'font-size': 13, fill: '#0369a1', 'text-anchor': 'end' }, '', $('lanes'));

RACERS.forEach((r, i) => {
  const y = LANE_Y0 + i * LANE_H;
  const g = el('g', {}, $('lanes'));
  el('rect', { x: 44, y, width: 972, height: LANE_H - 3, rx: 9,
    fill: r.id === 'iss' ? '#ede9fe' : (i % 2 ? '#ffffff' : '#f0f9ff'), opacity: r.id === 'iss' ? 1 : 0.8 }, g);
  if (r.emo) txt({ x: 66, y: y + 24, 'font-size': 22, 'text-anchor': 'middle' }, r.emo, g);
  else el('use', { href: '#issSym', x: 48, y: y + 4, width: 36, height: 24 }, g);
  txt({ x: 90, y: y + 15, 'font-size': 14, fill: '#1e293b' }, r.name, g);
  txt({ x: 90, y: y + 29, 'font-size': 12, fill: r.color }, `${fmtInt(r.kmh)} km/h`, g);
  el('line', { x1: TRACK_X0, y1: y + 16, x2: TRACK_X1, y2: y + 16, stroke: '#cbd5e1', 'stroke-width': 3, 'stroke-dasharray': '2 8', 'stroke-linecap': 'round' }, g);
  const trail = el('line', { x1: TRACK_X0, y1: y + 16, x2: TRACK_X0, y2: y + 16, stroke: r.color, 'stroke-width': 5, 'stroke-linecap': 'round', opacity: 0.55 }, g);
  let token;
  if (r.emo) token = txt({ x: TRACK_X0, y: y + 25, 'font-size': 24, 'text-anchor': 'middle' }, r.emo, g);
  else token = el('use', { href: '#issSym', x: TRACK_X0 - 22, y: y + 2, width: 44, height: 28 }, g);
  const res = txt({ x: 904, y: y + 22, 'font-size': 14, fill: r.color }, '', g);
  lanes[r.id] = { r, y, trail, token, res };
});
// start line and finish flag
el('line', { x1: TRACK_X0, y1: LANE_Y0 - 2, x2: TRACK_X0, y2: LANE_Y0 + LANE_H * 8 - 4, stroke: '#16a34a', 'stroke-width': 3 }, $('lanes'));
el('line', { x1: TRACK_X1, y1: LANE_Y0 - 2, x2: TRACK_X1, y2: LANE_Y0 + LANE_H * 8 - 4, stroke: '#1e293b', 'stroke-width': 3, 'stroke-dasharray': '6 4' }, $('lanes'));

const startBtn = makeBtn($('raceBar'), { x: 50, y: 428, w: 210, h: 42, label: '▶ Start race', fs: 19, fill: '#16a34a', stroke: '#14532d', color: '#fff' }, startRace);
const clockTxt = txt({ x: 284, y: 456, 'font-size': 21, fill: '#0c4a6e' }, '', $('raceBar'));
const ffTxt = txt({ x: 1012, y: 456, 'font-size': 15, fill: '#64748b', 'text-anchor': 'end' }, '', $('raceBar'));

function pickRoute(r) {
  RS.route = r;
  routeBtns.forEach((b, i) => ROUTES[i] === r ? b.setLook('#0ea5e9', '#0369a1', '#fff') : b.setLook('#fff', '#94a3b8', '#334155'));
  routeFrom.textContent = `🟢 ${r.from}`;
  routeTo.textContent = `${r.to} 🏁`;
  resetRace();
  say('🏁', `Race from <b>${r.from}</b> to <b>${r.to}</b>: ${fmtInt(r.km)} km. Who gets there first? Press <b>Start race</b>!`);
}

function resetRace() {
  RS.phase = 'idle'; RS.t = 0; RS.done.clear();
  startBtn.setLabel('▶ Start race');
  clockTxt.textContent = '⏱ Race clock: 0 sec';
  ffTxt.textContent = '';
  RACERS.forEach(r => { lanes[r.id].res.textContent = ''; });
  drawRace();
}

function startRace() {
  resetRace();
  RS.phase = 'iss';
  RS.base = tripTime(RACERS[0]) / ISS_SHOW_S;
  startBtn.setLabel('↺ Race again');
  say('🚦', `Ready, steady, GO! Everyone leaves <b>${RS.route.from}</b> at the same moment…`);
}

function drawRace() {
  RACERS.forEach(r => {
    const L = lanes[r.id];
    const f = clamp(RS.t * r.kmh / 3600 / RS.route.km, 0, 1);
    const x = TRACK_X0 + f * (TRACK_X1 - TRACK_X0);
    L.trail.setAttribute('x2', x);
    if (r.emo) L.token.setAttribute('x', x); else L.token.setAttribute('x', x - 22);
  });
}

function finishRacer(r) {
  RS.done.add(r.id);
  lanes[r.id].res.textContent = fmtDur(tripTime(r));
  const iss = fmtDur(tripTime(RACERS[0]));
  const times = Math.round(ISS_KMH / r.kmh);
  if (r.id === 'car') {
    say('🚗', `The car finally gets there after <b>${fmtDur(tripTime(r))}</b>. The Space Station took <b>${iss}</b>. It is <b>${times} times</b> faster than a car on the motorway!`);
  } else if (r.id === 'walk') {
    const extra = RS.route.id === 'earth' ? ' That is almost a whole year, and you would have to walk on water!' : '';
    say('🚶', `Walking takes <b>${fmtDur(tripTime(r))}</b>.${extra} The Space Station did it in <b>${iss}</b>: <b>${fmtInt(times)} times</b> faster than walking!`);
  }
}

function stepRace(dt) {
  if (RS.phase === 'idle' || RS.phase === 'done') return;
  const tIss = tripTime(RACERS[0]);
  if (RS.phase === 'iss') {
    RS.rate = RS.base;
    RS.t += dt * RS.rate;
    if (RS.t >= tIss) {
      RS.t = tIss; RS.phase = 'pause'; RS.pause = 3.2;
      finishRacer(RACERS[0]);
      const planePct = (900 / ISS_KMH * 100).toFixed(1);
      say('🛰️', `The <b>Space Station</b> is already in ${RS.route.to}, after only <b>${fmtDur(tIss)}</b>! Look at the others: the airplane has done just ${planePct}% of the trip, and the car has hardly left.`);
    }
  } else if (RS.phase === 'pause') {
    RS.rate = 0;
    RS.pause -= dt;
    if (RS.pause <= 0) {
      RS.phase = 'ff'; RS.ff = 0;
      say('⏩', 'Now let\'s fast-forward time so everyone else can finish…');
    }
  } else if (RS.phase === 'ff') {
    RS.ff += dt;
    RS.rate = RS.base * Math.pow(2, RS.ff / 0.5);
    RS.t += dt * RS.rate;
  }
  for (const r of RACERS) {
    if (!RS.done.has(r.id) && RS.t >= tripTime(r)) finishRacer(r);
  }
  const tWalk = tripTime(RACERS[RACERS.length - 1]);
  if (RS.t >= tWalk) { RS.t = tWalk; RS.phase = 'done'; RS.rate = 0; }
  clockTxt.textContent = `⏱ Race clock: ${fmtDur(RS.t)}`;
  ffTxt.textContent = RS.rate > 1 ? `time sped up ${fmtInt(RS.rate)}×` : (RS.phase === 'pause' ? 'paused' : '');
  drawRace();
}

// =========================================================================
// 2. STOPWATCH: HOW FAR IN A BLINK, A SECOND, A MINUTE?
// =========================================================================
const MILES = [
  { km: 0.15,  emo: '🏏', name: 'Across a cricket ground' },
  { km: 0.83,  emo: '🏙️', name: 'Burj Khalifa, lying down' },
  { km: 8.85,  emo: '⛰️', name: 'Mount Everest, lying down' },
  { km: 30,    emo: '🌆', name: 'Right across Lahore' },
  { km: 375,   emo: '🛣️', name: 'Lahore → Islamabad' },
  { km: 1200,  emo: '🚆', name: 'Lahore → Karachi' },
  { km: 6300,  emo: '✈️', name: 'Lahore → London' },
  { km: 12742, emo: '🌏', name: 'Straight through the Earth' },
  { km: 40075, emo: '🌍', name: 'Around the whole Earth' },
];
const fmtShortT = s => s < 1 ? `${s.toFixed(2)} s` : s < 10 ? `${s.toFixed(1)} s` : s < 60 ? `${Math.round(s)} s` : fmtDur(s);

const msG = $('milestones');
const msRows = MILES.map((m, i) => {
  const y = 546 + i * 27;
  el('rect', { x: 540, y, width: 472, height: 24, rx: 8, fill: '#fff', stroke: '#ddd6fe', 'stroke-width': 1.5 }, msG);
  const bar = el('rect', { x: 540, y, width: 0, height: 24, rx: 8, fill: '#ddd6fe' }, msG);
  txt({ x: 557, y: y + 18, 'font-size': 15, 'text-anchor': 'middle' }, m.emo, msG);
  const name = txt({ x: 576, y: y + 17, 'font-size': 14, fill: '#475569' }, m.name, msG);
  const t = txt({ x: 1000, y: y + 17, 'font-size': 14, fill: '#7c3aed', 'text-anchor': 'end' }, `in ${fmtShortT(m.km / ISS_KMS)}`, msG);
  return { m, bar, name, t };
});

const SW = { t: 0, run: false, target: 0, passed: 0, what: '' };
const swBtns = $('swBtns');
makeBtn(swBtns, { x: 50, y: 704, w: 150, h: 40, label: '👁️ One blink', fs: 16 }, () => timed(0.3, 'one blink'));
makeBtn(swBtns, { x: 208, y: 704, w: 150, h: 40, label: '⏱️ One second', fs: 16 }, () => timed(1, 'one second'));
makeBtn(swBtns, { x: 366, y: 704, w: 150, h: 40, label: '⏳ One minute', fs: 16 }, () => timed(60, 'one minute'));
const swGo = makeBtn(swBtns, { x: 50, y: 752, w: 270, h: 40, label: '▶ Start stopwatch', fs: 16, fill: '#7c3aed', stroke: '#4c1d95', color: '#fff' }, toggleSw);
makeBtn(swBtns, { x: 328, y: 752, w: 188, h: 40, label: '↺ Reset', fs: 16 }, resetSw);

function resetSw() {
  SW.t = 0; SW.run = false; SW.target = 0; SW.passed = 0;
  swGo.setLabel('▶ Start stopwatch');
  msRows.forEach(r => { r.bar.setAttribute('fill', '#ddd6fe'); r.name.setAttribute('fill', '#475569'); r.name.textContent = r.m.name; });
  drawSw();
  $('swCmp').textContent = 'Press a button to start the clock';
  $('swCar').textContent = '';
}
function timed(sec, what) {
  resetSw();
  SW.run = true; SW.target = sec; SW.what = what;
  swGo.setLabel('⏸ Stop');
}
function toggleSw() {
  if (SW.run) { SW.run = false; swGo.setLabel('▶ Keep going'); return; }
  if (SW.target) { resetSw(); }
  SW.run = true; SW.target = 0;
  swGo.setLabel('⏸ Stop');
  say('⏱️', 'The stopwatch is running in <b>real time</b>. Every second the Space Station flies another <b>7.7 km</b>. Watch it pass the milestones!');
}
const fmtKm = d => d < 1 ? `${fmtInt(d * 1000)} m` : d < 100 ? `${d.toFixed(1)} km` : `${fmtInt(d)} km`;
function drawSw() {
  const d = SW.t * ISS_KMS;
  $('swDist').textContent = fmtKm(d);
  const t = SW.t;
  $('swTime').textContent = t < 60 ? `in ${t.toFixed(t < 10 ? 2 : 1)} seconds`
    : `in ${Math.floor(t / 60)} min ${String(Math.floor(t % 60)).padStart(2, '0')} sec`;
  if (t > 0) {
    $('swCmp').textContent = `= ${fmtInt(d / 0.15)} cricket grounds in a row`;
    $('swCar').textContent = `🚗 A car would go only ${fmtKm(t * 120 / 3600)}`;
  }
  msRows.forEach(r => r.bar.setAttribute('width', 472 * clamp(d / r.m.km, 0, 1)));
}
function stepSw(dt) {
  if (!SW.run) return;
  SW.t += dt;
  let finished = false;
  if (SW.target && SW.t >= SW.target) { SW.t = SW.target; SW.run = false; finished = true; swGo.setLabel('▶ Start stopwatch'); }
  const d = SW.t * ISS_KMS;
  while (SW.passed < MILES.length && d >= MILES[SW.passed].km) {
    const m = MILES[SW.passed];
    msRows[SW.passed].bar.setAttribute('fill', '#c4b5fd');
    msRows[SW.passed].name.setAttribute('fill', '#3b0764');
    msRows[SW.passed].name.textContent = m.name + ' ✅';
    say(m.emo, `<b>${m.name}</b> done, in just <b>${fmtShortT(m.km / ISS_KMS)}</b>!`);
    SW.passed++;
  }
  drawSw();
  if (finished) {
    const car = fmtKm(SW.t * 120 / 3600);
    const extra = SW.target < 1 ? ' Faster than you can blink!' : SW.target === 60 ? ' That\'s further than Lahore to Islamabad, in one minute!' : '';
    say('🛰️', `In <b>${SW.what}</b> the Space Station flies <b>${fmtKm(d)}</b>. A car on the motorway goes only ${car}.${extra}`);
  }
}

// =========================================================================
// 3. SPACE PANEL: ORBIT VIEW
// =========================================================================
const OC = { x: 1310, y: 320 }, ORB_R = 142;
(function stars() {
  let s = 11;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 110; i++) {
    el('circle', { cx: 1052 + rnd() * 516, cy: 72 + rnd() * 726, r: 0.6 + rnd() * 1.4, fill: '#fff', opacity: 0.25 + rnd() * 0.6 }, $('stars'));
  }
})();
(function continents() {
  const g = $('continents');
  const blobs = [[-55, -30, 38, 22, -30], [40, -55, 45, 20, 20], [65, 30, 28, 34, 10], [-20, 72, 30, 20, -15], [-88, 45, 18, 26, 30], [96, -12, 15, 10, 0], [10, 10, 16, 12, 40]];
  for (const [cx, cy, rx, ry, rot] of blobs) {
    el('ellipse', { cx: OC.x + cx, cy: OC.y + cy, rx, ry, fill: '#22c55e', transform: `rotate(${rot} ${OC.x + cx} ${OC.y + cy})` }, g);
  }
  el('circle', { cx: OC.x, cy: OC.y, r: 22, fill: '#f8fafc', opacity: 0.95 }, g);
})();

const O = { mode: 'orbit', speed: 600, t: 0, theta0: 0, sunrises: 0, sunsets: 0, pop: 0 };
const ctl = $('orbitCtl');
txt({ x: 1068, y: 594, 'font-size': 14, fill: '#c7d2fe' }, 'Speed:', ctl);
const SPEEDS = [[1, 'Real speed'], [60, '60× faster'], [600, '600× faster']];
const speedBtns = SPEEDS.map(([v, label], i) => makeBtn(ctl, { x: 1128 + i * 144, y: 572, w: 136, h: 34, label, fs: 14 }, () => setSpeed(v)));
const stat = (x, title) => {
  el('rect', { x, y: 618, width: 156, height: 58, rx: 12, fill: '#1e293b', stroke: '#4338ca', 'stroke-width': 2 }, ctl);
  txt({ x: x + 78, y: 639, 'font-size': 13, 'text-anchor': 'middle', fill: '#a5b4fc' }, title, ctl);
  return txt({ x: x + 78, y: 666, 'font-size': 20, 'text-anchor': 'middle', fill: '#fff' }, '0', ctl);
};
const stTime = stat(1068, '⏰ Time on Earth');
const stLaps = stat(1232, '🔁 Laps of the Earth');
const stSun = stat(1396, '🌅 Sunrises seen');
const FACTS = [
  '⚡ 27,600 km/h: about 7.7 km every second',
  '🔁 Once around the Earth every 92 minutes',
  '⚽ That\'s one lap in about one football match',
  '🌅 16 sunrises and 16 sunsets every day',
  '⬆️ Only 400 km up: Lahore to Islamabad, straight up!',
];
FACTS.forEach((f, i) => txt({ x: 1072, y: 704 + i * 21, 'font-size': 15, fill: '#e0e7ff' }, f, ctl));

function setSpeed(v) {
  O.speed = v;
  speedBtns.forEach((b, i) => SPEEDS[i][0] === v ? b.setLook('#facc15', '#a16207', '#1e293b') : b.setLook('#fff', '#94a3b8', '#334155'));
  if (v === 1) say('🐢', 'This is the <b>real</b> speed. It looks slow because the Earth is <b>huge</b>, but the Space Station is still flying <b>7.7 km every second</b>!');
  else say('🌍', `Time is going <b>${v}× faster</b> here. Count the sunrises: astronauts see one about every <b>1.5 hours</b>!`);
}

function stepOrbit(dt) {
  O.t += dt * O.speed;
  const th = O.theta0 + 2 * Math.PI * O.t / ORBIT_S;
  const x = OC.x + ORB_R * Math.cos(th), y = OC.y - ORB_R * Math.sin(th);
  $('issOrbG').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(-(th * 180 / Math.PI) - 90).toFixed(1)})`);
  // short glowing trail behind the station
  let d = '';
  for (let k = 0; k <= 16; k++) {
    const a = th - 0.75 * k / 16;
    d += (k ? 'L' : 'M') + (OC.x + ORB_R * Math.cos(a)).toFixed(1) + ' ' + (OC.y - ORB_R * Math.sin(a)).toFixed(1);
  }
  $('issTrail').setAttribute('d', d);
  // the Earth turns once a day, much slower than the station goes round
  $('continents').setAttribute('transform', `rotate(${(-360 * O.t / DAY_S) % 360} ${OC.x} ${OC.y})`);
  // sunrise when the station crosses the top (night -> day), sunset at the bottom
  const rises = th >= Math.PI / 2 ? Math.floor((th - Math.PI / 2) / (2 * Math.PI)) + 1 : 0;
  const sets = th >= 3 * Math.PI / 2 ? Math.floor((th - 3 * Math.PI / 2) / (2 * Math.PI)) + 1 : 0;
  if (rises > O.sunrises) { O.sunrises = rises; popup('🌅 Sunrise!', 160); }
  if (sets > O.sunsets) { O.sunsets = sets; popup('🌇 Sunset!', 486); }
  if (O.pop > 0) { O.pop -= dt; $('sunPop').setAttribute('opacity', clamp(O.pop, 0, 1)); }
  const mins = Math.floor(O.t / 60);
  stTime.textContent = mins < 60 ? `${mins} min` : mins < 1440 ? `${Math.floor(mins / 60)} hr ${mins % 60} min` : `${Math.floor(mins / 1440)} d ${Math.floor(mins % 1440 / 60)} hr`;
  stLaps.textContent = Math.floor((th - O.theta0) / (2 * Math.PI));
  stSun.textContent = O.sunrises;
}
function popup(s, y) { $('sunPop').textContent = s; $('sunPop').setAttribute('y', y); O.pop = 1.6; }

// =========================================================================
// 4. SPACE PANEL: WHY SO FAST? THROW A BALL OFF A GIANT TOWER
// =========================================================================
const GM = 398600.4, RE = 6371, R0 = RE + 400, EARTH_PX = 115;
const ORBIT_V = Math.sqrt(GM / R0);   // 7.67 km/s
const V_MAX = 8.0;
// heights are squashed so a 400 km tower and a 1,700 km high loop both fit
const hPx = h => h <= 0 ? 0 : 50 * Math.pow(h / 400, 0.45);
function toScreen(x, y) {
  const r = Math.hypot(x, y), a = Math.atan2(y, x), rv = EARTH_PX + hPx(r - RE);
  return [OC.x + rv * Math.cos(a), OC.y - rv * Math.sin(a)];
}

const TS = { v: ORBIT_V, run: false, x: 0, y: R0, vx: 0, vy: 0, swept: 0, prev: 0, simT: 0, pts: [], closed: false, rate: 600 };
const tc = $('throwCtl');
txt({ x: 1070, y: 590, 'font-size': 16, fill: '#c7d2fe' }, 'How fast do we throw?', tc);
const vTxt = txt({ x: 1550, y: 590, 'font-size': 18, fill: '#fde68a', 'text-anchor': 'end' }, '', tc);
const SL_X0 = 1085, SL_X1 = 1535, SL_Y = 618;
el('line', { x1: SL_X0, y1: SL_Y, x2: SL_X1, y2: SL_Y, stroke: '#475569', 'stroke-width': 8, 'stroke-linecap': 'round' }, tc);
const slX = v => SL_X0 + v / V_MAX * (SL_X1 - SL_X0);
el('line', { x1: slX(7.6), y1: SL_Y, x2: SL_X1, y2: SL_Y, stroke: '#22c55e', 'stroke-width': 8, 'stroke-linecap': 'round' }, tc);
const slFill = el('line', { x1: SL_X0, y1: SL_Y, x2: SL_X0, y2: SL_Y, stroke: '#fb923c', 'stroke-width': 8, 'stroke-linecap': 'round' }, tc);
const knob = el('circle', { id: 'knob', cx: SL_X0, cy: SL_Y, r: 14, fill: '#fff', stroke: '#f97316', 'stroke-width': 4, tabindex: 0, role: 'slider', 'aria-label': 'Throw speed' }, tc);
const PRESETS = [[120 / 3600, '🚗 car'], [900 / 3600, '✈️ plane'], [3, '3 km/s'], [6, '6 km/s'], [ORBIT_V, '🛰️ ISS'], [8, '8 km/s']];
PRESETS.forEach(([v, label], i) => makeBtn(tc, { x: 1070 + i * 81, y: 642, w: 75, h: 32, label, fs: 13 }, () => { setV(v); throwBall(); }));
makeBtn(tc, { x: 1070, y: 686, w: 480, h: 46, label: '⚾ THROW!', fs: 22, fill: '#f97316', stroke: '#9a3412', color: '#fff' }, throwBall);
const resTxt = txt({ x: 1310, y: 764, 'font-size': 18, 'text-anchor': 'middle', fill: '#fde68a' }, 'Pick a speed and throw the ball!', tc);

function setV(v) {
  TS.v = clamp(v, 0, V_MAX);
  const x = slX(TS.v);
  knob.setAttribute('cx', x); slFill.setAttribute('x2', x);
  knob.setAttribute('aria-valuenow', TS.v.toFixed(2));
  vTxt.textContent = `${TS.v.toFixed(2)} km/s = ${fmtInt(TS.v * 3600)} km/h`;
}
function svgPoint(e) {
  const pt = $('svg').createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform($('svg').getScreenCTM().inverse());
}
let dragging = false;
// pinch-zoom works everywhere except on the control a finger is dragging
document.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && e.target.closest && e.target.closest('#knob')) e.preventDefault();
}, { passive: false });
knob.addEventListener('pointerdown', e => { dragging = true; knob.setPointerCapture(e.pointerId); });
knob.addEventListener('pointermove', e => { if (dragging) setV((svgPoint(e).x - SL_X0) / (SL_X1 - SL_X0) * V_MAX); });
knob.addEventListener('pointerup', () => { dragging = false; });
knob.addEventListener('pointercancel', () => { dragging = false; });
knob.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { setV(TS.v + 0.1); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { setV(TS.v - 0.1); e.preventDefault(); }
  if (e.key === 'Enter') throwBall();
});

function throwBall() {
  // keep the last few throws as faint lines to compare
  const old = $('ballPath').getAttribute('points');
  if (old) {
    el('polyline', { points: old, fill: 'none', stroke: '#fdba74', 'stroke-width': 2, opacity: 0.35, 'stroke-dasharray': '5 5' }, $('ghosts'));
    while ($('ghosts').children.length > 4) $('ghosts').firstChild.remove();
  }
  Object.assign(TS, { run: true, x: 0, y: R0, vx: -TS.v, vy: 0, swept: 0, prev: Math.PI / 2, simT: 0, closed: false });
  TS.rate = 200 + 600 * clamp(TS.v / ORBIT_V, 0, 1);
  TS.pts = [toScreen(0, R0)];
  $('boom').setAttribute('display', 'none');
  resTxt.textContent = 'Wheee…';
  say('⚾', `Throwing at <b>${fmtInt(TS.v * 3600)} km/h</b>. Watch where it goes!`);
}

function stepThrow(dt) {
  if (!TS.run) return;
  let sim = dt * TS.rate;
  while (sim > 0) {
    const h = Math.min(2, sim); sim -= h;
    let r = Math.hypot(TS.x, TS.y), a = -GM / (r * r * r);
    TS.vx += a * TS.x * h / 2; TS.vy += a * TS.y * h / 2;
    TS.x += TS.vx * h; TS.y += TS.vy * h;
    r = Math.hypot(TS.x, TS.y); a = -GM / (r * r * r);
    TS.vx += a * TS.x * h / 2; TS.vy += a * TS.y * h / 2;
    TS.simT += h;
    const ang = Math.atan2(TS.y, TS.x);
    let da = ang - TS.prev;
    if (da > Math.PI) da -= 2 * Math.PI;
    if (da < -Math.PI) da += 2 * Math.PI;
    TS.swept += da; TS.prev = ang;
    if (r <= RE) { TS.x *= RE / r; TS.y *= RE / r; landed(); break; }
    if (!TS.closed && TS.swept >= 2 * Math.PI) { TS.closed = true; inOrbit(); }
  }
  const p = toScreen(TS.x, TS.y);
  if (!TS.closed) {
    TS.pts.push(p);
    $('ballPath').setAttribute('points', TS.pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' '));
  }
  $('ball').setAttribute('cx', p[0]); $('ball').setAttribute('cy', p[1]);
}
function landed() {
  TS.run = false;
  const p = toScreen(TS.x, TS.y);
  $('boom').setAttribute('x', p[0]); $('boom').setAttribute('y', p[1] + 9); $('boom').setAttribute('display', 'inline');
  const km = RE * TS.swept;
  TS.pts.push(p);
  $('ballPath').setAttribute('points', TS.pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' '));
  if (km < 50) {
    resTxt.textContent = 'Splat! It fell almost straight down.';
    say('💥', `At <b>${fmtInt(TS.v * 3600)} km/h</b> the ball drops almost straight down. Way too slow! Gravity pulls everything towards the middle of the Earth.`);
  } else {
    resTxt.textContent = `Landed ${fmtInt(km)} km away.`;
    say('💥', `It flew <b>${fmtInt(km)} km</b> before it hit the ground. Throw faster and it lands <b>further away</b>, because the round Earth curves away underneath it. How fast before it <b>never</b> lands?`);
  }
}
function inOrbit() {
  if (TS.v <= 7.8) {
    resTxt.textContent = '🎉 It never lands! It is in ORBIT!';
    say('🎉', 'It never lands! It is <b>falling all the time</b>, but it moves sideways so fast that the Earth curves away just as fast as it falls. That is an <b>orbit</b>, and it is why the Space Station must fly <b>27,600 km/h</b>. Any slower and it would come down.');
  } else {
    resTxt.textContent = '🎉 Still in orbit, in a stretched loop!';
    say('🎉', 'Still in orbit! Even faster swings it further out into a stretched loop called an <b>ellipse</b>. At about <b>11 km/s</b> it would fly away from the Earth forever!');
  }
}

// =========================================================================
// TABS
// =========================================================================
const tabOrbit = makeBtn($('tabs'), { x: 1066, y: 82, w: 240, h: 36, label: '🌍 Around the Earth', fs: 16 }, () => setMode('orbit'));
const tabThrow = makeBtn($('tabs'), { x: 1314, y: 82, w: 240, h: 36, label: '⚾ Why so fast?', fs: 16 }, () => setMode('throw'));
function setMode(m) {
  O.mode = m;
  const orbit = m === 'orbit';
  $('orbitG').setAttribute('display', orbit ? 'inline' : 'none');
  $('orbitCtl').setAttribute('display', orbit ? 'inline' : 'none');
  $('throwG').setAttribute('display', orbit ? 'none' : 'inline');
  $('throwCtl').setAttribute('display', orbit ? 'none' : 'inline');
  tabOrbit.setLook(orbit ? '#facc15' : '#1e293b', orbit ? '#a16207' : '#475569', orbit ? '#1e293b' : '#e2e8f0');
  tabThrow.setLook(!orbit ? '#facc15' : '#1e293b', !orbit ? '#a16207' : '#475569', !orbit ? '#1e293b' : '#e2e8f0');
  if (orbit) say('🌍', 'The Space Station goes all the way around the Earth every <b>92 minutes</b>. Count the sunrises!');
  else say('🤔', 'Why does it have to go so fast? Imagine throwing a ball off a giant tower <b>400 km tall</b>. Try a slow throw first, then faster and faster!');
}

// =========================================================================
// BOOT
// =========================================================================
setV(3);
setSpeed(600);
setMode('orbit');
pickRoute(ROUTES[0]);
resetSw();
say('🧑‍🚀', 'The Space Station flies at <b>27,600 km/h</b>. That is <b>7.7 km every second!</b> Press <b>Start race</b> to see how fast that really is.');

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  stepRace(dt);
  stepSw(dt);
  if (O.mode === 'orbit') stepOrbit(dt); else stepThrow(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
