<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(attrs, text, parent) {
  const t = el('text', { 'font-size': 15, 'font-weight': 'bold', fill: '#334155', ...attrs }, parent);
  t.textContent = text; return t;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
const lerp = (a, b, t) => a + (b - a) * t;
const f1 = v => v.toFixed(1);
const setT = (e, t) => e.setAttribute('transform', t);
const show = (e, on) => e.setAttribute('display', on ? 'inline' : 'none');
const op = (e, v) => e.setAttribute('opacity', clamp(v, 0, 1).toFixed(2));

const COL = {
  N: ['#60a5fa', '#1e40af'], O: ['#f87171', '#991b1b'],
  dust: ['#a16207', '#422006'], water: ['#67e8f9', '#0e7490'],
};

// a tiny bit of air: nitrogen and oxygen come in pairs of atoms
function molecule(kind, parent, s = 1) {
  const g = el('g', {}, parent);
  const [fill, stroke] = COL[kind];
  if (kind === 'N' || kind === 'O') {
    el('circle', { cx: -6 * s, cy: 0, r: 9 * s, fill, stroke, 'stroke-width': 1.5 }, g);
    el('circle', { cx: 6 * s, cy: 0, r: 9 * s, fill, stroke, 'stroke-width': 1.5 }, g);
  } else if (kind === 'dust') {
    el('path', { d: 'M-8 -2 L-3 -8 L5 -7 L9 0 L4 8 L-5 7 Z', fill, stroke, 'stroke-width': 1.5 }, g);
  } else {
    el('path', { d: 'M0 -11 C5 -4 9 0 9 4 A9 9 0 0 1 -9 4 C-9 0 -5 -4 0 -11 Z', fill, stroke, 'stroke-width': 1.5 }, g);
  }
  return g;
}

// points along a polyline, by fraction of its length
function polyline(pts) {
  const seg = []; let L = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    seg.push([L, d]); L += d;
  }
  return {
    pts, L,
    at(f) {
      const s = clamp(f, 0, 1) * L;
      for (let i = 0; i < seg.length; i++) {
        if (s <= seg[i][0] + seg[i][1] || i === seg.length - 1) {
          const t = seg[i][1] ? (s - seg[i][0]) / seg[i][1] : 0;
          return [lerp(pts[i][0], pts[i + 1][0], t), lerp(pts[i][1], pts[i + 1][1], t)];
        }
      }
    },
  };
}

// gas flowing through the pipes

function makeAir() {
  const ps = [];
  const add = (kind, n) => { for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, sp = 90 + Math.random() * 70;
    ps.push({ kind, x: lerp(BOX.x0 + 20, BOX.x1 - 20, Math.random()), y: lerp(BOX.y0 + 20, BOX.y1 - 20, Math.random()),
              vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: Math.random() * 180, spin: (Math.random() - 0.5) * 200,
              leaveAt: 2, leaving: false, gone: false, op: 1, caughtAt: -1, fx: 0, fy: 0, g: null });
  } };
  add('N', 32); add('O', 8); add('dust', 3); add('water', 3);
  for (let i = ps.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ps[i], ps[j]] = [ps[j], ps[i]]; }
  const Ns = ps.filter(p => p.kind === 'N').map(p => [Math.random(), p]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  Ns.forEach((p, k) => p.leaveAt = 0.22 + 0.68 * k / (Ns.length - 1));
  let c = 0; ps.filter(p => p.kind === 'dust' || p.kind === 'water').forEach(p => { p.binSlot = c++; p.catchAt = 0.1 + c * 0.1; });
  return ps;
}
const airLayer = el('g', {}, sAir);
let air = [];
function buildAir() {
  airLayer.textContent = '';
  air = makeAir();
  air.forEach(p => p.g = molecule(p.kind, airLayer));
}

const fresh = () => ({
  phase: 'air', t: 0, clock: 0, fill: 0, holding: false, heat: 0, frost: 0, flow: 2,
  liqH: 0, fullT: 0, fanA: 0, bubT: 0,
});
const S = { ...fresh(), slow: false };
const prog = name => idx(S.phase) > idx(name) ? 1 : S.phase === name ? S.t : 0;

function step(dt) {
  S.clock += dt;
  if (ANIM[S.phase]) {
    S.t += dt / ANIM[S.phase];
    if (S.t >= 1) { S.phase = NEXT[S.phase]; S.t = 0; }
  }
  // filling: only while the button is held down
  const filling = S.phase === 'prepped' && S.holding;
  if (filling) {
    S.fill = Math.min(1, S.fill + dt / FILL_TIME);
    if (S.fill >= 1) { S.phase = 'full'; S.fullT = 1; S.holding = false; }
  }
  S.heat = clamp(S.heat + (filling ? 0.2 : -0.06) * dt, 0, 1);
  S.frost = clamp(S.frost + (filling ? 0.35 : -0.04) * dt, 0, 1);
  S.fullT = Math.max(0, S.fullT - dt * 0.7);
  S.fanA += dt * (S.phase === 'clean' ? 720 : 40);

  // the tiny bits of air
  const cool = prog('cool'), sep = prog('separate'), clean = prog('clean');
  const T = airTemp();
  const liq = ease(clamp((cool - 0.55) / 0.45, 0, 1));
  const sp = 0.25 + 0.75 * clamp((T + 200) / 225, 0, 1);
  const present = air.filter(p => !p.gone && !p.leaving && (p.kind === 'N' || p.kind === 'O'));
  const perRow = 20, w = Math.min(present.length, perRow) * 27, xs = (BOX.x0 + BOX.x1) / 2 - w / 2 + 13;
  present.forEach((p, i) => { const r = Math.floor(i / perRow); p.sx = xs + (i % perRow) * 27 + (r % 2) * 13; p.sy = BOX.y1 - 16 - r * 21; });
  const rows = Math.ceil(present.length / perRow);
  S.liqH += ((rows * 21 + 14) - S.liqH) * Math.min(1, dt * 3);

  air.forEach(p => {
    if (p.gone) return;
    if (p.kind === 'dust' || p.kind === 'water') {
      if (clean >= p.catchAt) {
        if (p.caughtAt < 0) { p.caughtAt = S.clock; p.fx = p.x; p.fy = p.y; }
        const k = ease(clamp((S.clock - p.caughtAt) / 0.9, 0, 1));
        const bx = BIN.x0 + 50 + (p.binSlot % 3) * 50, by = BIN.y0 + 70 + Math.floor(p.binSlot / 3) * 60;
        p.x = lerp(p.fx, bx, k); p.y = lerp(p.fy, by, k) - Math.sin(k * Math.PI) * 60;
        if (S.phase !== 'clean' && idx(S.phase) > idx('clean')) { p.x = bx; p.y = by; }
        return;
      }
    }
    if (p.kind === 'N' && sep >= p.leaveAt) p.leaving = true;
    if (p.leaving) {
      p.y -= 85 * dt; p.x += Math.sin(S.clock * 3 + p.leaveAt * 40) * 30 * dt; p.rot += p.spin * dt;
      if (p.y < BOX.y0 + 10) p.op -= dt * 1.6;
      if (p.op <= 0) p.gone = true;
      return;
    }
    p.x += p.vx * sp * (1 - liq) * dt; p.y += p.vy * sp * (1 - liq) * dt;
    p.rot += p.spin * sp * (1 - liq * 0.9) * dt;
    const m = 14;
    if (p.x < BOX.x0 + m) { p.x = BOX.x0 + m; p.vx = Math.abs(p.vx); }
    if (p.x > BOX.x1 - m) { p.x = BOX.x1 - m; p.vx = -Math.abs(p.vx); }
    if (p.y < BOX.y0 + m) { p.y = BOX.y0 + m; p.vy = Math.abs(p.vy); }
    if (p.y > BOX.y1 - m) { p.y = BOX.y1 - m; p.vy = -Math.abs(p.vy); }
    if (liq > 0 && p.sx !== undefined) {
      const k = Math.min(1, dt * 5 * liq);
      p.x += (p.sx + Math.sin(S.clock * 4 + p.leaveAt * 30) * 2 - p.x) * k;
      p.y += (p.sy + Math.cos(S.clock * 5 + p.leaveAt * 20) * 1.5 - p.y) * k;
    }
  });

  // oxygen bits packing into the cylinder
  const n = Math.floor(S.fill * cylMols.length);
  cylMols.forEach((m, i) => { if (i < n && m.born < 0) m.born = S.clock; });

  // bubbles in the hospital bottle
  if (S.phase === 'hospital') {
    S.bubT += dt * S.flow * 2.2;
    while (S.bubT >= 1) {
      S.bubT -= 1;
      const b = hBubbles.find(b => b.y < 0);
      if (b) { b.y = 766; b.x = 315; }
    }
    hBubbles.forEach(b => { if (b.y >= 0) { b.y -= dt * 80; b.x = 315 + Math.sin(b.y / 7) * 4; if (b.y < 704) b.y = -1; } });
  }
}

function airTemp() {
  const p = S.phase, i = idx(p);
  if (i >= idx('prep')) return p === 'hospital' ? 25 : 25 + S.heat * 20;
  if (i < idx('cool')) return 25;
  if (p === 'cool') return 25 - 225 * ease(S.t);
  if (p === 'liquid') return -200;
  if (p === 'separate') return -200 + 10 * ease(clamp(S.t * 2.5, 0, 1));
  if (p === 'separated') return -190;
  return -190 + 7 * prog('store');
}
function pressure() {
  const p = S.phase, i = idx(p);
  if (i < idx('cool')) return 1;
  if (p === 'cool') return 1 + 5 * ease(S.t);
  if (p === 'liquid') return 6;
  if (p === 'separate') return 6 - 4.5 * S.t;
  if (i < idx('prep')) return 1.5;
  if (p === 'prep') return 5 * (1 - clamp(S.t * 1.6, 0, 1));
  if (p === 'prepped') return S.fill * 150;
  return 150;
}

  // ---------- factory ----------
  const h = HL[Math.min(cur, 7)];
  hl.setAttribute('x', h[0]); hl.setAttribute('y', h[1]); hl.setAttribute('width', h[2]); hl.setAttribute('height', h[3]);
  op(hl, 0.55 + 0.45 * Math.sin(S.clock * 4));
  setT(blades, `translate(85 300) rotate(${f1(S.fanA % 360)})`);
  op(filterDirt, prog('clean'));
  op(coldFrost, 0.55 * clamp((25 - Math.min(T, 25)) / 225, 0, 1) * (i < idx('prep') ? 1 : 0) + (i >= idx('cool') ? 0.15 : 0));
  // tower: liquid air, then liquid oxygen
  op(towerLiq, i >= idx('liquid') || (ph === 'cool' && S.t > 0.6) ? 1 : 0);
  towerLiq.setAttribute('fill', prog('separate') > 0.9 ? '#93c5fd' : '#c7d2fe');
  op(n2Label, prog('separate') > 0.05 ? 1 : 0);
  // tank level
  const lvl = 0.75 * ease(prog('store')) - 0.12 * S.fill;
  tankLiq.setAttribute('y', f1(392 - 184 * lvl)); tankLiq.setAttribute('height', f1(184 * lvl));
  op(vapFrost, S.frost);
  topCyl.forEach(c => {
    const hh = 104 * S.fill;
    c.lvl.setAttribute('y', f1(388 - hh)); c.lvl.setAttribute('height', f1(hh));
    op(c.cap, clamp((prog('leak') - 0.6) * 4, 0, 1));
  });
  const dk = prog('deliver');
  setT(truck, `translate(${f1(800 + ease(dk) * 110)} ${GROUND})`);
  op(truck, ph === 'deliver' ? Math.min(1, dk * 8, (1 - dk) * 6) : 0);

  // flowing dots
  const active = { clean: ph === 'clean', cool: ph === 'cool', separate: ph === 'separate', store: ph === 'store', fill: S.phase === 'prepped' && S.holding };
  for (const k in FLOWS) {
    const F = FLOWS[k];
    F.dots.forEach((d, j) => {
      if (!active[k]) { show(d, false); return; }
      const f = (S.clock * F.speed + j / F.n) % 1, [x, y] = F.line.at(f);
      show(d, true); d.setAttribute('cx', f1(x)); d.setAttribute('cy', f1(y));
      let c = F.kind === 'air' ? (j % 5 === 0 ? '#f87171' : '#60a5fa') : F.kind === 'N' ? '#60a5fa' : F.kind === 'lox' ? '#93c5fd' : f < 0.38 ? '#93c5fd' : '#f87171';
      if (k === 'cool' && f > 0.75) c = '#c7d2fe';
      d.setAttribute('fill', c);
    });
  }
  n2Puffs.forEach((g, j) => {
    const on = ph === 'separate' || ph === 'separated';
    if (!on) { show(g, false); return; }
    const f = (S.clock * 0.25 + j / 6) % 1;
    show(g, true); op(g, 1 - f);
    setT(g, `translate(${f1(456 + f * 60 + Math.sin(f * 9 + j) * 6)} ${f1(140 - f * 60)}) rotate(${f1(f * 200 + j * 40)})`);
  });

  // ---------- zoom ----------
  const sceneAir = i < idx('prep'), sceneHosp = ph === 'hospital', sceneCyl = !sceneAir && !sceneHosp;
  show(sAir, sceneAir); show(sCyl, sceneCyl); show(sHosp, sceneHosp);
  $('zoomTitle').innerHTML = sceneAir ? 'ZOOM IN <tspan font-size="16" font-weight="normal">(tiny bits of air, made HUGE)</tspan>'
    : sceneCyl ? 'ZOOM IN <tspan font-size="16" font-weight="normal">(at the filling station)</tspan>'
    : 'ZOOM IN <tspan font-size="16" font-weight="normal">(at the hospital)</tspan>';

  if (sceneAir) renderAir(T);
  if (sceneCyl) renderCyl();
  if (sceneHosp) renderHosp();

  // gauges
  const ty = thermoY(T);
  merc.setAttribute('y', f1(ty)); merc.setAttribute('height', f1(735 - ty));
  tempTx.textContent = `${Math.round(T)} °C`.replace('-', '−');
  const [nx, ny] = dialPt(P, DC.r - 14);
  needle.setAttribute('x2', f1(nx)); needle.setAttribute('y2', f1(ny));
  presTx.textContent = `${P < 10 ? P.toFixed(1) : Math.round(P)} bar`;
  if (P < 0.5) { presSub1.textContent = 'empty: nothing'; presSub2.textContent = 'pushing out'; }
  else if (P < 1.6) { presSub1.textContent = 'about the same'; presSub2.textContent = 'as the air around us'; }
  else { presSub1.textContent = `squeezed about ${Math.round(P)}×`; presSub2.textContent = 'tighter than air'; }

  // panel: steps + button
  stepRows.forEach(r => {
    const done = r.k < cur, now = r.k === cur;
    op(r.bg, now ? 1 : 0);
    r.c.setAttribute('fill', done ? '#22c55e' : now ? '#f59e0b' : '#e2e8f0');
    r.n.setAttribute('fill', done || now ? '#fff' : '#475569');
    r.n.textContent = done ? '✓' : r.k + 1;
    r.tx.setAttribute('font-weight', now ? 'bold' : 'normal');
  });
  let [mt, mc] = MAIN[ph];
  if (ph === 'prepped' && S.holding) [mt, mc] = ['filling… keep holding!', '#b91c1c'];
  $('mainText').textContent = mt;
  $('mainRect').setAttribute('fill', mc || '#cbd5e1');
  $('mainText').setAttribute('fill', mc ? '#fff' : '#64748b');
  $('mainBtn').style.cursor = mc ? 'pointer' : 'default';
  if (ph === 'prepped' && S.holding) $('mainRect').setAttribute('filter', 'url(#glow)'); else $('mainRect').removeAttribute('filter');
  $('status').textContent = status(P);

  const [emo, text, color] = message();
  if (emo + text !== lastMsg) {
    $('msgEmo').textContent = emo; $('msgText').innerHTML = text;
    $('msg').style.borderColor = color; lastMsg = emo + text;
  }
}

function renderAir(T) {
  const ph = S.phase, sep = prog('separate'), cold = clamp((25 - T) / 225, 0, 1);
  op(coldTint, cold * 0.45);
  const liq = ease(clamp((prog('cool') - 0.55) / 0.45, 0, 1));
  const onlyO = sep >= 1;
  liquid.setAttribute('y', f1(BOX.y1 - 3 - S.liqH)); liquid.setAttribute('height', f1(S.liqH));
  liquid.setAttribute('fill', onlyO ? '#93c5fd' : '#c7d2fe'); op(liquid, liq * 0.85);
  op(liqLabel, liq > 0.6 ? 1 : 0);
  liqLabel.textContent = onlyO ? 'liquid oxygen: it\'s pale blue!' : sep > 0 ? 'liquid air (losing its nitrogen)' : 'liquid air';
  op(boilLabel, ph === 'separate' ? Math.min(1, sep * 6) : 0);
  op(flask, prog('store')); op(boxLabel, 1 - prog('store') * 2);

  air.forEach(p => {
    if (p.gone) { show(p.g, false); return; }
    show(p.g, true); op(p.g, p.op);
    setT(p.g, `translate(${f1(p.x)} ${f1(p.y)}) rotate(${f1(p.rot)})`);
  });
  const nN = air.filter(p => p.kind === 'N' && !p.gone && !p.leaving).length;
  const nO = air.filter(p => p.kind === 'O').length;
  const nD = air.filter(p => (p.kind === 'dust' || p.kind === 'water') && p.caughtAt < 0).length;
  cntN.textContent = `nitrogen: ${nN}`;
  cntO.textContent = `oxygen: ${nO}`;
  cntD.textContent = nD ? `dust + water: ${nD}` : 'dust + water: 0 ✓';
  op(binEmpty, nD === 6 ? 1 : 0);
  const fr = nO / (nN + nO);
  barO.setAttribute('width', f1(Math.max(16, 210 * fr)));
  pctO.textContent = `oxygen: ${Math.round(fr * 100)} out of 100`;
}

function renderCyl() {
  const ph = S.phase, pp = prog('prep'), lk = prog('leak');
  checkTx.forEach((t, k) => {
    const ok = pp > (k + 1) / 3.6;
    t.textContent = (ok ? '✅ ' : '⬜ ') + CHECKS[k];
    t.setAttribute('fill', ok ? '#166534' : '#94a3b8');
  });
  op(hose, pp > 0.85 && lk < 0.15 ? 1 : 0);
  op(vapFrostZ, S.frost * 0.9);
  op(warmTint, S.heat * 0.55); op(warmTxt, S.heat > 0.3 ? 1 : 0);
  const filling = ph === 'prepped' && S.holding;
  vapDots.forEach((d, j) => {
    if (!filling) { show(d, false); return; }
    const f = (S.clock * 0.22 + j / vapDots.length) % 1, [x, y] = VAP_LINE.at(f);
    show(d, true); d.setAttribute('cx', f1(x)); d.setAttribute('cy', f1(y));
    d.setAttribute('fill', f < 0.45 ? '#93c5fd' : '#f87171');
    d.setAttribute('r', f < 0.45 ? 6 : 4.5);
  });
  const jig = 1 + S.heat * 2.5;
  cylMols.forEach(m => {
    if (m.born < 0) { show(m.g, false); return; }
    const k = ease(clamp((S.clock - m.born) / 0.6, 0, 1));
    const x = lerp(440, m.home[0], k) + Math.sin(S.clock * 9 + m.ph) * jig;
    const y = lerp(660, m.home[1], k) + Math.cos(S.clock * 11 + m.ph) * jig;
    show(m.g, true);
    setT(m.g, `translate(${f1(x)} ${f1(y)}) rotate(${f1(m.ph * 30 + S.clock * 40 * S.heat)})`);
  });
  op(stamp, (lk - 0.75) * 5);
  bubbles.forEach((b, j) => {
    const on = lk > 0.1 && lk < 0.62;
    op(b.e, on ? 0.9 : 0);
    b.e.setAttribute('r', f1(b.r + Math.sin(S.clock * 6 + j) * 0.8));
  });
  const capK = ease(clamp((lk - 0.6) / 0.25, 0, 1));
  op(cap, capK > 0 ? 1 : 0); setT(cap, `translate(${f1(-220 * (1 - capK))} 0)`);
  op(fullPop, S.fullT); setT(fullPop, `translate(0 ${f1(676 - (1 - S.fullT) * 30)})`);
  if (ph === 'prep' || ph === 'stored') cylFact.textContent = '';
  else if (ph === 'prepped') cylFact.textContent = S.fill > 0 ? '💡 1 cup of liquid oxygen makes about 850 cups of oxygen gas!' : '';
  else if (ph === 'full') cylFact.textContent = `💡 about ${CYL_LITRES.toLocaleString('en')} litres of oxygen, squeezed into this cylinder`;
  else if (ph === 'leak') cylFact.textContent = lk < 0.6 ? '🫧 soapy water on the valve: no bubbles growing = no leak ✓' : '🟢 a plastic seal goes on the valve';
  else cylFact.textContent = '✅ sealed, labelled and ready to go';
}

function renderHosp() {
  ball.setAttribute('cy', f1(630 - S.flow * 11 + Math.sin(S.clock * 10) * 1.2));
  flowTx.textContent = `${S.flow} litre${S.flow > 1 ? 's' : ''} a minute`;
  hBubbles.forEach(b => {
    if (b.y < 0) { show(b.e, false); return; }
    show(b.e, true); b.e.setAttribute('cx', f1(b.x)); b.e.setAttribute('cy', f1(b.y));
  });
  tubeDots.forEach((d, j) => {
    const f = (S.clock * 0.08 * S.flow + j / tubeDots.length) % 1, [x, y] = TUBE_LINE.at(f);
    d.setAttribute('cx', f1(x)); d.setAttribute('cy', f1(y));
  });
  mask.setAttribute('fill-opacity', (0.55 + 0.25 * Math.sin(S.clock * 1.8)).toFixed(2));
  const hours = Math.round(CYL_LITRES / S.flow / 60);
  const days = Math.floor(hours / 24);
  const L = ['This cylinder holds', `about ${CYL_LITRES.toLocaleString('en')} litres.`, `At ${S.flow} litre${S.flow > 1 ? 's' : ''} a minute`, 'it lasts about',
             `${hours} hours!`, days >= 1 ? `(that's over ${days > 1 ? days + ' days' : 'a day'})` : ''];
  lastsTx.forEach((t, k) => t.textContent = L[k]);
}

function stepIndex() {
  switch (S.phase) {
    case 'air': case 'clean': return 0;
    case 'cleaned': case 'cool': return 1;
    case 'liquid': case 'separate': return 2;
    case 'separated': case 'store': return 3;
    case 'stored': case 'prep': return 4;
    case 'prepped': return 5;
    case 'full': case 'leak': return 6;
    case 'sealed': case 'deliver': return 7;
  }
  return 8;
}

function status(P) {
  switch (S.phase) {
    case 'air': return 'Oxygen: mixed into the air';
    case 'clean': return 'Cleaning the air…';
    case 'cleaned': return 'Air: clean and dry';
    case 'cool': return 'Cooling… colder… colder…';
    case 'liquid': return 'Air: it\'s a LIQUID now!';
    case 'separate': return 'Nitrogen boiling away…';
    case 'separated': return 'Oxygen: liquid and pure';
    case 'store': return 'Pouring into the tank…';
    case 'stored': return 'Oxygen: in the big tank';
    case 'prep': return 'Checking the cylinder…';
    case 'prepped': return S.fill === 0 ? 'Cylinder: empty, hooked up' : `Cylinder: ${Math.round(S.fill * 100)}% full`;
    case 'full': return 'Cylinder: FULL! (150 bar)';
    case 'leak': return 'Leak test…';
    case 'sealed': return 'Cylinder: sealed ✔';
    case 'deliver': return 'On the way to the hospital…';
  }
  return 'Oxygen: helping someone breathe';
}

function message() {
  switch (S.phase) {
    case 'air': return ['🌬️', 'Air is a <b>mix</b> of tiny bits, too small to see. About <b>4 out of every 5</b> are <b>nitrogen</b> and only <b>1 in 5</b> is <b>oxygen</b>, the part we breathe. Let\'s get the oxygen out!', '#94a3b8'];
    case 'clean': case 'cleaned': return ['🧹', 'A big fan sucks air in. A <b>filter</b> catches dust and a <b>dryer</b> grabs the water. In the cold part, water would freeze into <b>ice</b> and block the pipes!', '#eab308'];
    case 'cool': return ['❄️', 'The air gets <b>squeezed</b> and <b>cooled</b>, again and again. Squeezed air that spreads out fast gets colder (a spray can feels cold too). The tiny bits <b>slow down</b>…', '#3b82f6'];
    case 'liquid': return ['💧', 'At about <b>−200°C</b> the bits are so slow they huddle together. The air has turned into a <b>liquid</b>! Now for the clever trick…', '#3b82f6'];
    case 'separate': return ['♨️', 'Warm it a tiny bit. <b>Nitrogen</b> boils at <b>−196°C</b>, so it turns back into gas and floats away first. <b>Oxygen</b> boils at <b>−183°C</b>, so it stays a liquid.', '#f97316'];
    case 'separated': return ['🔴', 'Only <b>oxygen</b> is left! Liquid oxygen is <b>pale blue</b>, and more than 99 out of 100 bits are oxygen. A real factory does this in a <b>tall tower</b>, all day long.', '#ef4444'];
    case 'store': case 'stored': return ['🛢️', 'It goes into a giant <b>thermos flask</b>: a tank with two walls and <b>empty space</b> between them, so heat can\'t get in. Big hospitals have these too: tall white tanks outside!', '#6366f1'];
    case 'prep': return ['🔍', 'First, check the empty cylinder: its <b>test date</b> is stamped on it, there\'s <b>no oil or grease</b> (oil + pure oxygen can catch fire!), and the old gas is let out.', '#eab308'];
    case 'prepped':
      if (S.holding) return ['💨', 'A pump pushes liquid oxygen through the <b>vaporizer</b>. Outside air warms it, so it turns back into <b>gas</b> (look at the frost!) and gets <b>squeezed</b> into the cylinder.', '#dc2626'];
      if (S.fill > 0) return ['✋', `Valve closed. The cylinder is only <b>${Math.round(S.fill * 100)}% full</b>. Press and hold the button again to keep filling! Feel it? Squeezing gas makes the cylinder <b>warm</b>.`, '#f59e0b'];
      return ['⛽', 'All good! The cylinder is hooked up to the filling pipe. <b>Press and hold</b> the red button (or the space bar) to fill it.', '#dc2626'];
    case 'full': return ['🎉', '<b>FULL!</b> At about <b>150 bar</b> the oxygen is squeezed about 150 times tighter than air. A cylinder about as tall as you holds <b>6,800 litres</b>: more than <b>30 bathtubs</b>!', '#22c55e'];
    case 'leak': return ['🫧', 'Leak test: brush <b>soapy water</b> on the valve. A leak would blow <b>bubbles that grow</b>. None grow, so no leak! Then a <b>plastic seal</b> goes on top.', '#0ea5e9'];
    case 'sealed': return ['✅', 'Sealed! The seal shows nobody has opened it. A <b>white top</b> is the colour code for <b>oxygen</b> in lots of countries, so nobody mixes it up with a different gas.', '#22c55e'];
    case 'deliver': return ['🚚', 'A truck takes the full cylinders to the hospital, strapped in tight so they can\'t roll or fall.', '#22c55e'];
  }
  return ['🏥', 'The <b>regulator</b> lets the gas out gently, the <b>flowmeter</b> ball shows how much is flowing, and the <b>bubble bottle</b> adds a little water. Try <b>+</b> and <b>−</b>!', '#22c55e'];
}

// =====================================================================
// input
// =====================================================================
function mainAction() {
  const p = S.phase;
  if (p === 'air') { S.phase = 'clean'; S.t = 0; }
  else if (p === 'cleaned') { S.phase = 'cool'; S.t = 0; }
  else if (p === 'liquid') { S.phase = 'separate'; S.t = 0; }
  else if (p === 'separated') { S.phase = 'store'; S.t = 0; }
  else if (p === 'stored') { S.phase = 'prep'; S.t = 0; }
  else if (p === 'full') { S.phase = 'leak'; S.t = 0; }
  else if (p === 'sealed') { S.phase = 'deliver'; S.t = 0; }
  else if (p === 'hospital') reset();
}
function reset() {
  const slow = S.slow; Object.assign(S, fresh(), { slow });
  buildAir();
  cylMols.forEach(m => m.born = -1);
  hBubbles.forEach(b => b.y = -1);
}
function toggleSlow() {
  S.slow = !S.slow;
  $('slowRect').setAttribute('fill', S.slow ? '#fde68a' : '#e2e8f0');
  $('slowText').textContent = S.slow ? '🐢 slow-mo ON' : '🐢 slow-mo';
}
const setFlow = d => { S.flow = clamp(S.flow + d, 1, 10); };

// the main button: click for most steps, press and hold to fill
const mb = $('mainBtn');
let downPhase = null;
// pinch-zoom works everywhere except on the control a finger is dragging
document.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && e.target.closest && e.target.closest('#mainBtn')) e.preventDefault();
}, { passive: false });
mb.addEventListener('pointerdown', e => {
  downPhase = S.phase;
  if (S.phase === 'prepped') { S.holding = true; mb.setPointerCapture(e.pointerId); e.preventDefault(); }
});
const letGo = () => { S.holding = false; };
mb.addEventListener('pointerup', letGo);
mb.addEventListener('pointercancel', letGo);
mb.addEventListener('lostpointercapture', letGo);
mb.addEventListener('click', () => { if (downPhase !== 'prepped') mainAction(); downPhase = null; });
mb.addEventListener('contextmenu', e => e.preventDefault());

$('slowBtn').addEventListener('click', toggleSlow);
$('resetBtn').addEventListener('click', reset);
btnMinus.addEventListener('click', () => setFlow(-1));
btnPlus.addEventListener('click', () => setFlow(1));
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (S.phase === 'prepped') S.holding = true; else mainAction();
  }
  else if (k === 's') toggleSlow();
  else if (k === 'r') reset();
  else if (k === '+' || k === '=' || k === 'arrowup') setFlow(1);
  else if (k === '-' || k === 'arrowdown') setFlow(-1);
});
addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') S.holding = false; });
addEventListener('blur', letGo);

buildAir();
window.__step = sec => { for (let t = 0; t < sec; t += 1 / 60) step(1 / 60); render(); };

let last = performance.now();
function frame(now) {
  let dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  if (S.slow) dt *= 0.35;
  step(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
